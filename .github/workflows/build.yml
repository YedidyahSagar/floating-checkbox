name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FloatingCheckbox"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.floatcheck"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.floatcheck"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              kotlinOptions { jvmTarget = "17" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          // No dependencies, no ads, no analytics.
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application android:label="Floating Checkbox"
                  android:icon="@android:drawable/checkbox_on_background">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatService" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_overlay_checkbox"/>
                  </service>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/floatcheck
          cat > app/src/main/java/com/example/floatcheck/MainActivity.kt <<'EOF_FILE'
          package com.example.floatcheck

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 96, 48, 48)
                  }
                  root.addView(Button(this).apply {
                      text = "Show floating checkbox"
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")))
                          } else {
                              startForegroundService(Intent(this@MainActivity, FloatService::class.java))
                          }
                      }
                  })
                  root.addView(Button(this).apply {
                      text = "Hide floating checkbox"
                      setOnClickListener { stopService(Intent(this@MainActivity, FloatService::class.java)) }
                  })
                  setContentView(root)
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/example/floatcheck/FloatService.kt <<'EOF_FILE'
          package com.example.floatcheck

          import android.app.*
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.*
          import android.widget.CheckBox

          class FloatService : Service() {
              private lateinit var wm: WindowManager
              private var box: CheckBox? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("float", "Floating checkbox", NotificationManager.IMPORTANCE_MIN))
                  val n = Notification.Builder(this, "float")
                      .setSmallIcon(android.R.drawable.checkbox_on_background)
                      .setContentTitle("Floating checkbox is on").build()
                  if (Build.VERSION.SDK_INT >= 34)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, n)

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val prefs = getSharedPreferences("state", MODE_PRIVATE)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = prefs.getInt("x", 100); y = prefs.getInt("y", 300)
                  }

                  val cb = CheckBox(this).apply {
                      isChecked = prefs.getBoolean("checked", false)
                      scaleX = 1.5f; scaleY = 1.5f
                      setBackgroundColor(0xCCFFFFFF.toInt())
                      setPadding(24, 24, 24, 24)
                      setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("checked", c).apply() }
                  }
                  var dx = 0f; var dy = 0f; var sx = 0; var sy = 0; var drag = false
                  cb.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { dx = e.rawX; dy = e.rawY; sx = lp.x; sy = lp.y; drag = false; false }
                          MotionEvent.ACTION_MOVE -> {
                              val mx = e.rawX - dx; val my = e.rawY - dy
                              if (Math.abs(mx) > 12 || Math.abs(my) > 12) drag = true
                              if (drag) { lp.x = sx + mx.toInt(); lp.y = sy + my.toInt(); wm.updateViewLayout(cb, lp) }
                              drag
                          }
                          MotionEvent.ACTION_UP -> {
                              if (drag) prefs.edit().putInt("x", lp.x).putInt("y", lp.y).apply()
                              drag
                          }
                          else -> false
                      }
                  }
                  box = cb
                  wm.addView(cb, lp)
              }

              override fun onDestroy() {
                  box?.let { wm.removeView(it) }
                  super.onDestroy()
              }
          }
          EOF_FILE
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "Floating Checkbox v${{ github.run_number }}" --notes "Debug APK"
